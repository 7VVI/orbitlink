name: orbitlink
description: "星轨远控 —— Flutter + Dart FFI 远程桌面客户端"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  window_manager: ^0.4.2
  web_socket_channel: ^3.0.1
  ffi: ^2.1.3
  flutter_webrtc: 0.12.7
  orbitlink_rtc:
    path: ../packages/orbitlink_rtc

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
